<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZICORE VR Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#04060c;--cyan:#00e5ff;--purple:#7c4dff;--green:#00ff88;--red:#ff3333;--orange:#ffa500;--text:#c8d6e5;--text2:#667788;--border:#2a3555;--glass:rgba(4,6,12,0.92)}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw}
#vrCanvas{width:100vw;height:100vh;display:block;background:#000;cursor:crosshair}
.overlay{position:fixed;z-index:10;pointer-events:none}
.overlay>*{pointer-events:auto}

/* Top HUD */
.top-hud{top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(180deg,rgba(4,6,12,.9),transparent)}
.top-hud .brand{font-size:11px;font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-hud .sep{width:1px;height:16px;background:var(--border)}
.top-hud .info{font-size:9px;color:var(--text2);letter-spacing:.5px}
.top-hud .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:9px;color:var(--green)}
.top-hud .status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Mode indicator */
.mode-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:1px;border:1px solid}
.mode-badge.walk{color:var(--green);border-color:rgba(0,255,136,.4);background:rgba(0,255,136,.1)}
.mode-badge.fly{color:var(--cyan);border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.1)}
.mode-badge.noclip{color:var(--orange);border-color:rgba(255,165,0,.4);background:rgba(255,165,0,.1)}

/* Controls Panel */
.controls{bottom:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 16px;background:linear-gradient(0deg,rgba(4,6,12,.9),transparent);flex-wrap:wrap}
.ctrl-btn{padding:4px 10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text2);cursor:pointer;font-size:9px;letter-spacing:1px;transition:all .15s;font-family:inherit}
.ctrl-btn:hover{border-color:rgba(0,229,255,.3);color:var(--cyan);background:rgba(0,229,255,.05)}
.ctrl-btn.active{background:rgba(0,229,255,.1);border-color:var(--cyan);color:var(--cyan)}
.ctrl-btn.danger{border-color:rgba(255,51,51,.3);color:var(--red)}
.ctrl-btn.danger:hover{background:rgba(255,51,51,.1)}
.ctrl-btn.green{border-color:rgba(0,255,136,.3);color:var(--green)}
.ctrl-btn.green:hover{background:rgba(0,255,136,.1)}
.ctrl-sep{width:1px;height:16px;background:var(--border)}
select.ctrl-select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:3px;font-size:9px;outline:none;font-family:inherit}
select.ctrl-select:focus{border-color:var(--cyan)}
.ctrl-label{font-size:8px;color:var(--text2);letter-spacing:1px}

/* Stats */
.stats-hud{bottom:50px;right:16px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.stat{font-size:9px;color:var(--text2);letter-spacing:.5px}
.stat b{color:var(--cyan);font-weight:600}

/* Crosshair */
.crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;opacity:.4}
.crosshair::before,.crosshair::after{content:'';position:absolute;background:var(--cyan)}
.crosshair::before{width:12px;height:1px;top:0;left:-6px}
.crosshair::after{width:1px;height:12px;top:-6px;left:0}

/* Fullscreen hint */
.fullscreen-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;color:var(--text2);font-size:11px;letter-spacing:2px;text-align:center;pointer-events:none;opacity:.6}

/* Speed bar */
.speed-bar{position:fixed;bottom:50px;left:16px;z-index:10;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.speed-bar .speed-label{font-size:8px;color:var(--text2);letter-spacing:1px}
.speed-bar .speed-track{width:120px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.speed-bar .speed-fill{height:100%;background:var(--cyan);border-radius:2px;transition:width .15s}
.speed-bar .speed-value{font-size:9px;color:var(--cyan);font-family:monospace}

/* Position display */
.pos-display{position:fixed;bottom:50px;left:150px;z-index:10;pointer-events:none}
.pos-display .pos-line{font-size:9px;color:var(--text2);font-family:monospace;letter-spacing:.5px}
.pos-display .pos-line b{color:var(--cyan)}
</style>
</head>
<body>

<canvas id="vrCanvas"></canvas>
<div class="crosshair"></div>

<!-- Top HUD -->
<div class="overlay top-hud">
  <div class="brand">ZICORE VR</div>
  <div class="sep"></div>
  <div class="info" id="sceneInfo">Sin sesion</div>
  <div class="sep"></div>
  <div class="info" id="eyeMode">MONO</div>
  <div class="sep"></div>
  <div class="mode-badge fly" id="modeBadge">FLY</div>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">DESCONECTADO</span>
  </div>
</div>

<!-- Controls -->
<div class="overlay controls">
  <span class="ctrl-label">ESCENA:</span>
  <select class="ctrl-select" id="sceneSelect">
    <option value="planetary_surface">Superficie Planetaria</option>
    <option value="space_station">Estacion Espacial</option>
    <option value="lunar_base">Base Lunar</option>
    <option value="launch_pad">Plataforma de Lanzamiento</option>
    <option value="cockpit">Cockpit</option>
    <option value="landscape">Paisaje</option>
  </select>
  <div class="ctrl-sep"></div>
  <span class="ctrl-label">MODO:</span>
  <button class="ctrl-btn" onclick="setMode('walk')" id="btnWalk">WALK</button>
  <button class="ctrl-btn active" onclick="setMode('fly')" id="btnFly">FLY</button>
  <button class="ctrl-btn" onclick="setMode('noclip')" id="btnNoClip">NOCLIP</button>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn green" onclick="startStream()" id="btnStart">INICIAR</button>
  <button class="ctrl-btn danger" onclick="stopStream()" id="btnStop" disabled>DETENER</button>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" onclick="toggleStereo()" id="btnStereo">STEREO</button>
  <button class="ctrl-btn" onclick="toggleFullscreen()">FULLSCREEN</button>
  <div class="ctrl-sep"></div>
  <span class="ctrl-label">FPS:</span>
  <select class="ctrl-select" id="fpsSelect">
    <option value="15">15</option>
    <option value="24">24</option>
    <option value="30" selected>30</option>
    <option value="60">60</option>
  </select>
  <div class="ctrl-sep"></div>
  <span class="ctrl-label">RES:</span>
  <select class="ctrl-select" id="resSelect">
    <option value="320x240">320x240</option>
    <option value="480x320">480x320</option>
    <option value="640x480" selected>640x480</option>
    <option value="800x600">800x600</option>
    <option value="1024x768">1024x768</option>
  </select>
</div>

<!-- Stats -->
<div class="overlay stats-hud">
  <div class="stat">FRAME: <b id="statFrame">0</b></div>
  <div class="stat">FPS: <b id="statFps">0</b></div>
  <div class="stat">LATENCY: <b id="statLatency">0ms</b></div>
  <div class="stat">RES: <b id="statRes">-</b></div>
  <div class="stat">SPEED: <b id="statSpeed">5.0</b> m/s</div>
</div>

<!-- Speed bar -->
<div class="speed-bar">
  <div class="speed-label">VELOCIDAD</div>
  <div class="speed-track"><div class="speed-fill" id="speedFill" style="width:50%"></div></div>
  <div class="speed-value" id="speedValue">5.0 m/s</div>
</div>

<!-- Position -->
<div class="pos-display">
  <div class="pos-line">X: <b id="posX">0.00</b></div>
  <div class="pos-line">Y: <b id="posY">1.70</b></div>
  <div class="pos-line">Z: <b id="posZ">0.00</b></div>
  <div class="pos-line">HDG: <b id="posHdg">0</b>° PITCH: <b id="posPitch">0</b>°</div>
</div>

<!-- Fullscreen hint -->
<div class="fullscreen-hint" id="fsHint">F fullscreen | WASD move | Mouse look | 1-3 modes | Shift sprint | Scroll speed</div>

<script>
const canvas = document.getElementById('vrCanvas');
const ctx = canvas.getContext('2d');
let ws = null;
let streaming = false;
let stereo = false;
let frameCount = 0;
let lastFrameTime = 0;
let fps = 0;

// ── Camera State ──
let camera = { yaw: 0, pitch: 0, x: 0, y: 1.7, z: 0 };
let cameraVelocity = { x: 0, y: 0, z: 0 };
let keys = {};
let mouseDown = false;
let lastMouse = { x: 0, y: 0 };
let lastTime = performance.now();

// ── Movement Config ──
let moveMode = 'fly';  // 'walk' | 'fly' | 'noclip'
const GRAVITY = -9.81;
const JUMP_FORCE = 7.0;
const GROUND_Y = 0.0;
const EYE_HEIGHT = 1.7;
const WALK_SPEED = 3.0;
const FLY_SPEED = 5.0;
const NOCLIP_SPEED = 8.0;
const SPRINT_MULT = 2.5;
const MOUSE_SENS = 0.15;
const ACCEL = 18.0;       // ground acceleration
const DECEL = 10.0;       // ground deceleration
const AIR_ACCEL = 4.0;    // air control
const AIR_DECEL = 2.0;
const MAX_SPEED_MULT = 1.2; // allow slight overshoot
let moveSpeed = FLY_SPEED;
let isSprinting = false;
let verticalVelocity = 0;
let onGround = true;
let pointerLocked = false;

// ── Mode System ──
const modes = {
  walk: { speed: WALK_SPEED, gravity: true, groundCollision: true, label: 'WALK', cssClass: 'walk', color: 'var(--green)' },
  fly: { speed: FLY_SPEED, gravity: false, groundCollision: false, label: 'FLY', cssClass: 'fly', color: 'var(--cyan)' },
  noclip: { speed: NOCLIP_SPEED, gravity: false, groundCollision: false, label: 'NOCLIP', cssClass: 'noclip', color: 'var(--orange)' },
};

function setMode(mode) {
  if (!modes[mode]) return;
  moveMode = mode;
  moveSpeed = modes[mode].speed;
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  const badge = document.getElementById('modeBadge');
  badge.textContent = modes[mode].label;
  badge.className = 'mode-badge ' + modes[mode].cssClass;
  updateSpeedUI();
}

// ── Resize ──
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ── Pointer Lock ──
canvas.addEventListener('click', () => {
  if (!pointerLocked) {
    canvas.requestPointerLock();
  }
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  camera.yaw -= e.movementX * MOUSE_SENS;
  camera.pitch = Math.max(-89, Math.min(89, camera.pitch - e.movementY * MOUSE_SENS));
  sendCamera();
});

// ── Mouse drag fallback (when not pointer locked) ──
canvas.addEventListener('mousedown', (e) => {
  if (pointerLocked) return;
  mouseDown = true;
  lastMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mousemove', (e) => {
  if (!mouseDown || pointerLocked) return;
  const dx = e.clientX - lastMouse.x;
  const dy = e.clientY - lastMouse.y;
  camera.yaw -= dx * MOUSE_SENS;
  camera.pitch = Math.max(-89, Math.min(89, camera.pitch - dy * MOUSE_SENS));
  lastMouse = { x: e.clientX, y: e.clientY };
  sendCamera();
});

// ── Scroll for speed ──
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.5 : 0.5;
  moveSpeed = Math.max(0.5, Math.min(30, moveSpeed + delta));
  updateSpeedUI();
  sendCamera();
}, { passive: false });

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'f') toggleFullscreen();
  if (k === 'escape' && streaming) stopStream();
  if (k === '1') setMode('walk');
  if (k === '2') setMode('fly');
  if (k === '3') setMode('noclip');
  if (k === 'shift' || k === 'control') isSprinting = true;
  // Space = jump in walk mode
  if (k === ' ' && moveMode === 'walk' && onGround) {
    verticalVelocity = JUMP_FORCE;
    onGround = false;
    e.preventDefault();
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
  if (e.key.toLowerCase() === 'shift' || e.key.toLowerCase() === 'control') isSprinting = false;
});

// ── WebSocket ──
function startStream() {
  if (ws) ws.close();
  const scene = document.getElementById('sceneSelect').value;
  const fpsVal = parseInt(document.getElementById('fpsSelect').value);
  const res = document.getElementById('resSelect').value.split('x');
  const w = parseInt(res[0]);
  const h = parseInt(res[1]);
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws/materializer-vr');
  ws.onopen = () => {
    setStatus('CONECTADO', true);
    ws.send(JSON.stringify({
      action: 'start', scene, stereo, width: w, height: h, fps: fpsVal,
    }));
    streaming = true;
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled = false;
    document.getElementById('sceneInfo').textContent = scene.replace(/_/g, ' ').toUpperCase();
    document.getElementById('eyeMode').textContent = stereo ? 'STEREO' : 'MONO';
    document.getElementById('statRes').textContent = w + 'x' + h;
    document.getElementById('fsHint').style.opacity = '0';
    frameCount = 0;
    lastTime = performance.now();
  };
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'stereo_frame') renderStereoFrame(data);
      else if (data.type === 'frame') renderMonoFrame(data);
    } catch (err) {}
  };
  ws.onclose = () => {
    setStatus('DESCONECTADO', false);
    streaming = false;
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled = true;
  };
  ws.onerror = () => setStatus('ERROR', false);
}

function stopStream() {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'stop' }));
  if (ws) ws.close();
  streaming = false;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
}

function setStatus(text, ok) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').style.background = ok ? 'var(--green)' : 'var(--red)';
  document.getElementById('statusDot').style.boxShadow = ok ? '0 0 6px var(--green)' : '0 0 6px var(--red)';
}

// ── Render frames ──
function renderStereoFrame(data) {
  const now = performance.now();
  if (lastFrameTime > 0) fps = Math.round(1000 / (now - lastFrameTime));
  lastFrameTime = now;
  frameCount++;
  const halfW = canvas.width / 2;
  const leftImg = new Image();
  leftImg.onload = () => {
    ctx.drawImage(leftImg, 0, 0, halfW, canvas.height);
    const rightImg = new Image();
    rightImg.onload = () => {
      ctx.drawImage(rightImg, halfW, 0, halfW, canvas.height);
      ctx.strokeStyle = 'rgba(0,229,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(halfW, 0);
      ctx.lineTo(halfW, canvas.height);
      ctx.stroke();
      updateStats(data);
    };
    rightImg.src = 'data:image/png;base64,' + data.right;
  };
  leftImg.src = 'data:image/png;base64,' + data.left;
}

function renderMonoFrame(data) {
  const now = performance.now();
  if (lastFrameTime > 0) fps = Math.round(1000 / (now - lastFrameTime));
  lastFrameTime = now;
  frameCount++;
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    updateStats(data);
  };
  img.src = 'data:image/png;base64,' + data.data;
}

function updateStats(data) {
  document.getElementById('statFrame').textContent = data.frame || frameCount;
  document.getElementById('statFps').textContent = fps;
  const latency = data.timestamp ? Math.round((Date.now() / 1000 - data.timestamp) * 1000) : 0;
  document.getElementById('statLatency').textContent = latency + 'ms';
}

// ── Game Loop (camera-relative movement with deltaTime) ──
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // cap at 100ms
  lastTime = timestamp;

  if (streaming) {
    const speed = moveSpeed * (isSprinting ? SPRINT_MULT : 1.0);
    let moved = false;

    // Calculate forward/right vectors from yaw (horizontal only)
    const yawRad = camera.yaw * Math.PI / 180;
    const sinYaw = Math.sin(yawRad);
    const cosYaw = Math.cos(yawRad);

    // Forward = -Z in local space, rotated by yaw
    const fwdX = -sinYaw;
    const fwdZ = -cosYaw;
    // Right = +X in local space, rotated by yaw
    const rightX = cosYaw;
    const rightZ = -sinYaw;

    let inputFwd = 0;
    let inputRight = 0;
    let inputUp = 0;

    if (keys['w'] || keys['arrowup']) inputFwd += 1;
    if (keys['s'] || keys['arrowdown']) inputFwd -= 1;
    if (keys['a']) inputRight -= 1;
    if (keys['d']) inputRight += 1;

    // Calculate desired velocity
    let desX = (fwdX * inputFwd + rightX * inputRight) * speed;
    let desZ = (fwdZ * inputFwd + rightZ * inputRight) * speed;

    if (moveMode === 'walk') {
      // Ground movement with acceleration/deceleration
      const accel = onGround ? ACCEL : AIR_ACCEL;
      const decel = onGround ? DECEL : AIR_DECEL;

      // Smooth acceleration
      cameraVelocity.x += (desX - cameraVelocity.x) * Math.min(1, accel * dt);
      cameraVelocity.z += (desZ - cameraVelocity.z) * Math.min(1, accel * dt);

      // Apply gravity
      if (!onGround) {
        verticalVelocity += GRAVITY * dt;
      }

      // Update position
      camera.x += cameraVelocity.x * dt;
      camera.z += cameraVelocity.z * dt;
      camera.y += verticalVelocity * dt;

      // Ground collision
      if (camera.y <= GROUND_Y + EYE_HEIGHT) {
        camera.y = GROUND_Y + EYE_HEIGHT;
        verticalVelocity = 0;
        onGround = true;
      }

      moved = Math.abs(desX) > 0.01 || Math.abs(desZ) > 0.01 || Math.abs(verticalVelocity) > 0.1;
    } else {
      // Fly / NoClip — direct position control with smooth interpolation
      if (moveMode === 'fly') {
        // Fly: smooth interpolation, Q/E for vertical
        cameraVelocity.x += (desX - cameraVelocity.x) * Math.min(1, ACCEL * dt);
        cameraVelocity.z += (desZ - cameraVelocity.z) * Math.min(1, ACCEL * dt);
        if (keys['q']) inputUp -= 1;
        if (keys['e']) inputUp += 1;
        cameraVelocity.y += (inputUp * speed - cameraVelocity.y) * Math.min(1, ACCEL * dt);
      } else {
        // NoClip: instant, no smoothing
        cameraVelocity.x = desX;
        cameraVelocity.z = desZ;
        if (keys['q']) inputUp -= 1;
        if (keys['e']) inputUp += 1;
        cameraVelocity.y = inputUp * speed;
      }

      camera.x += cameraVelocity.x * dt;
      camera.y += cameraVelocity.y * dt;
      camera.z += cameraVelocity.z * dt;

      // Clamp Y
      camera.y = Math.max(0.1, camera.y);

      moved = Math.abs(cameraVelocity.x) > 0.01 || Math.abs(cameraVelocity.z) > 0.01 || Math.abs(cameraVelocity.y) > 0.01;
    }

    // Arrow keys for yaw/pitch (always work)
    if (keys['arrowleft']) { camera.yaw -= 90 * dt; moved = true; }
    if (keys['arrowright']) { camera.yaw += 90 * dt; moved = true; }

    if (moved) sendCamera();
    updatePositionUI();
  }

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

function sendCamera() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      action: 'camera',
      yaw: camera.yaw,
      pitch: camera.pitch,
      x: camera.x,
      y: camera.y,
      z: camera.z,
      mode: moveMode,
      speed: moveSpeed * (isSprinting ? SPRINT_MULT : 1.0),
    }));
  }
}

function updateSpeedUI() {
  const pct = Math.min(100, (moveSpeed / 30) * 100);
  document.getElementById('speedFill').style.width = pct + '%';
  const displaySpeed = (moveSpeed * (isSprinting ? SPRINT_MULT : 1.0)).toFixed(1);
  document.getElementById('speedValue').textContent = displaySpeed + ' m/s';
  document.getElementById('statSpeed').textContent = displaySpeed;
}

function updatePositionUI() {
  document.getElementById('posX').textContent = camera.x.toFixed(2);
  document.getElementById('posY').textContent = camera.y.toFixed(2);
  document.getElementById('posZ').textContent = camera.z.toFixed(2);
  document.getElementById('posHdg').textContent = Math.round(((camera.yaw % 360) + 360) % 360);
  document.getElementById('posPitch').textContent = Math.round(camera.pitch);
}

// ── Controls ──
function toggleStereo() {
  stereo = !stereo;
  document.getElementById('btnStereo').classList.toggle('active', stereo);
  document.getElementById('eyeMode').textContent = stereo ? 'STEREO' : 'MONO';
  if (streaming) { stopStream(); setTimeout(startStream, 200); }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

// ── Keepalive ──
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'ping' }));
}, 15000);

// ── Init ──
updateSpeedUI();
document.getElementById('fsHint').style.opacity = '0.6';
</script>
</body>
</html>
