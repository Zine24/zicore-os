<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZMMX — Multimedia Library</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070f;--bg2:#0c0c1a;--bg3:#12122a;--bg4:#191933;--bg5:#242450;
  --cyan:#00e5ff;--purple:#7c4dff;--green:#00ff88;--red:#ff3d71;--orange:#ff9f43;--yellow:#ffd32a;
  --text:#d0d8e8;--text2:#7888a8;--text3:#4a5570;
  --border:rgba(0,229,255,0.09);--border2:rgba(0,229,255,0.18);
  --glass:rgba(7,7,15,0.96);--glass2:rgba(12,12,26,0.9);
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}

/* ── Topbar ── */
.topbar{height:48px;flex-shrink:0;background:var(--glass);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:30;backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer}
.logo svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(0,229,255,0.3))}
.logo span{font-size:13px;font-weight:800;letter-spacing:3px;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-tabs{display:flex;gap:2px;flex-shrink:0;overflow-x:auto;max-width:44vw}
.nav-tab{padding:7px 10px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .2s;border:1px solid transparent;letter-spacing:0.4px;background:transparent;white-space:nowrap}
.nav-tab:hover{color:var(--text);background:rgba(0,229,255,0.04)}
.nav-tab.active{color:var(--cyan);background:rgba(0,229,255,0.08);border-color:var(--border2);box-shadow:inset 0 -1px 0 rgba(0,229,255,0.3)}
.search-box{flex:1;max-width:320px;position:relative;margin-left:auto}
.search-box input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 12px 7px 30px;color:var(--text);font-size:12px;outline:none}
.search-box input:focus{border-color:var(--cyan)}
.search-box::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.src-chips{display:flex;gap:4px;flex-shrink:0}
.src-chip{padding:5px 9px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:0.4px}
.src-chip:hover{border-color:var(--cyan);color:var(--text)}
.src-chip.active{background:rgba(0,229,255,0.1);border-color:var(--cyan);color:var(--cyan)}
.clock{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:1px;flex-shrink:0;min-width:76px;text-align:right}

/* ── Manager (selector de módulos) ── */
.manager{position:relative;flex-shrink:0}
.mgr-btn{width:34px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--cyan);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mgr-btn:hover{border-color:var(--cyan);background:rgba(0,229,255,0.08)}
.mgr-menu{position:absolute;top:40px;right:0;width:260px;background:var(--glass2);border:1px solid var(--border2);border-radius:10px;padding:12px;z-index:80;display:none;backdrop-filter:blur(16px);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.mgr-menu.open{display:block}
.mgr-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);font-weight:700;margin-bottom:8px}
.mgr-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px;cursor:pointer;transition:background .15s;font-size:12px;color:var(--text2)}
.mgr-row:hover{background:rgba(0,229,255,0.04);color:var(--text)}
.mgr-row .mgr-icon{width:18px;text-align:center}
.mgr-row input{accent-color:var(--cyan);width:14px;height:14px;cursor:pointer}
.mgr-row .mgr-scale{font-family:var(--mono);font-size:9px;color:var(--text3);margin-left:auto}
.mgr-sep{height:1px;background:var(--border);margin:10px 0}
.mgr-zoom{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);padding:4px 2px}
.mgr-zoom input[type=range]{flex:1;height:3px;-webkit-appearance:none;background:var(--bg4);border-radius:2px;outline:none}
.mgr-zoom input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg2);cursor:pointer}
.mgr-zoom b{font-family:var(--mono);font-size:10px;color:var(--cyan);min-width:38px;text-align:right}
.mgr-reset{width:100%;padding:7px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:6px}
.mgr-reset:hover{border-color:var(--cyan);color:var(--cyan)}

/* ── Workspace ── */
#workspace{position:relative;flex:1;overflow:hidden}

/* ── Panels (ventanas modulares) ── */
.panel{position:absolute;min-width:300px;min-height:220px;background:var(--glass2);border:1px solid var(--border2);border-radius:9px;display:flex;flex-direction:column;box-shadow:0 10px 36px rgba(0,0,0,.5);overflow:hidden}
.panel.drag-over{border-color:var(--cyan);box-shadow:0 10px 44px rgba(0,229,255,.25)}
.panel .ph{height:34px;flex-shrink:0;display:flex;align-items:center;padding:0 10px;gap:8px;background:var(--bg3);border-bottom:1px solid var(--border);cursor:grab;user-select:none}
.panel .ph:active{cursor:grabbing}
.panel .ph .pt{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:0.6px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.panel .ph .pt .dots{display:flex;gap:3px}
.panel .ph .pt .dots i{width:6px;height:6px;border-radius:50%;display:inline-block}
.panel .ph .pt .dots i:nth-child(1){background:var(--red)}
.panel .ph .pt .dots i:nth-child(2){background:var(--yellow)}
.panel .ph .pt .dots i:nth-child(3){background:var(--green)}
.panel .ph-btns{display:flex;gap:3px}
.ph-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ph-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.ph-btn.max:hover{color:var(--yellow);border-color:var(--yellow)}
.ph-btn.close:hover{color:var(--red);border-color:var(--red)}
.panel .pbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel .presize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:12}
.panel .presize::after{content:'';position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--text3);border-bottom:2px solid var(--text3);opacity:.6}
.panel.filled{inset:0;width:auto;height:auto;min-width:0;min-height:0;border-radius:0;border:none}

/* ── Library ── */
.lib-layout{display:grid;grid-template-columns:230px 1fr;height:100%;min-height:0}
.lib-side{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.lib-side-h{padding:12px 16px;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);font-weight:700;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(0,229,255,0.05),transparent)}
.lib-tree{flex:1;overflow-y:auto;padding:6px 0}
.lib-drives{padding:4px 0;border-bottom:1px solid var(--border);max-height:132px;overflow-y:auto}
.explore-btn{width:calc(100% - 24px);margin:8px 12px 0;padding:7px;border-radius:6px;border:1px solid var(--border2);background:linear-gradient(135deg,rgba(0,229,255,0.08),rgba(124,77,255,0.08));color:var(--cyan);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.explore-btn:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,0.15);background:linear-gradient(135deg,rgba(0,229,255,0.14),rgba(124,77,255,0.14))}
.drive-item{padding:6px 16px;cursor:pointer;transition:all .15s;border-left:2px solid transparent}
.drive-item:hover{background:rgba(0,229,255,0.04)}
.drive-item.active{background:linear-gradient(90deg,rgba(124,77,255,0.1),rgba(0,229,255,0.04));border-left-color:var(--purple)}
.drive-item .drive-line{display:flex;align-items:center;gap:8px}
.drive-item .di{width:16px;text-align:center;font-size:12px}
.drive-item .dn{font-size:11px;font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drive-item.active .dn{color:var(--cyan)}
.drive-item .dc{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:7px;border:1px solid var(--border)}
.drive-item .dp{font-size:8px;color:var(--text3);padding-left:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.7}
.loading.small{padding:18px;font-size:11px}
.loading.small::after{width:20px;height:20px;margin:10px auto}
.empty.small{padding:22px 10px;font-size:11px}
.empty.small .big{font-size:26px}
.tree-section{margin-bottom:2px}
.tree-label{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s;font-weight:600;letter-spacing:0.5px;border-left:2px solid transparent}
.tree-label:hover{color:var(--text);background:rgba(0,229,255,0.04)}
.tree-label.active{color:var(--cyan);background:linear-gradient(90deg,rgba(0,229,255,0.08),rgba(124,77,255,0.04));border-left-color:var(--cyan)}
.tree-label .icon{width:16px;text-align:center;font-size:13px}
.tree-label .count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 7px;border-radius:8px;border:1px solid var(--border)}
.tree-item{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 40px;font-size:11px;color:var(--text3);cursor:pointer;transition:all .15s}
.tree-item:hover{color:var(--text2);background:rgba(0,229,255,0.02)}
.tree-item.active{color:var(--cyan)}
.tree-item .dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.dot-local{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.dot-zicorefs{background:var(--purple);box-shadow:0 0 6px var(--purple)}
.dot-jilocomotion{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot-vol{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.lib-stats{padding:11px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);
  background:linear-gradient(180deg,transparent,rgba(124,77,255,0.05))}
.lib-stats div{display:flex;justify-content:space-between;padding:2px 0}
.lib-stats span:last-child{color:var(--text2);font-family:var(--mono)}
.lib-main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.lib-banner{display:flex;align-items:center;gap:16px;padding:12px 16px;background:linear-gradient(120deg,rgba(0,229,255,0.07),rgba(124,77,255,0.07),rgba(0,255,136,0.04));border-bottom:1px solid var(--border);flex-wrap:wrap}
.lib-banner .lb-stat{display:flex;flex-direction:column;gap:1px;min-width:72px}
.lib-banner .lb-stat b{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--cyan)}
.lib-banner .lb-stat span{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);font-weight:700}
.lib-banner .lb-sep{width:1px;height:26px;background:var(--border2)}
.lib-banner .lb-note{margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:0.5px}
.lib-toolbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap}
.lib-toolbar .title{font-size:13px;font-weight:700;color:var(--text)}
.lib-toolbar .count{font-size:10px;color:var(--text3);font-family:var(--mono)}
.tb-btn{width:26px;height:26px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--cyan);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s;flex-shrink:0}
.tb-btn:hover{border-color:var(--cyan);background:rgba(0,229,255,0.08)}
.tool-actions{display:flex;gap:4px;flex-shrink:0}
.tb-upload{padding:0 12px;width:auto;gap:6px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green);border-color:rgba(0,255,136,0.3);background:rgba(0,255,136,0.06)}
.tb-upload:hover{background:rgba(0,255,136,0.12);border-color:var(--green);box-shadow:0 0 12px rgba(0,255,136,0.2)}
.tb-codecs{color:var(--purple);font-size:13px}
.tb-codecs:hover{border-color:var(--purple);background:rgba(124,77,255,0.08)}
.tb-filter{color:var(--yellow);font-size:13px}
.tb-filter:hover{border-color:var(--yellow);background:rgba(255,211,42,0.08)}
.tb-crumbs{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--text3);max-width:38%;overflow:hidden;white-space:nowrap;flex-wrap:nowrap}
.crumb{cursor:pointer;color:var(--cyan);padding:2px 4px;border-radius:3px;transition:background .15s;white-space:nowrap}
.crumb:hover{background:rgba(0,229,255,0.08)}
.crumb-sep{opacity:.4}
.dir-row .fi-icon{color:var(--yellow);font-size:15px}
.dir-row:hover .fi-icon{color:var(--yellow)}
.dir-row .fi-name{color:var(--text2);font-weight:600}
.dir-row:hover .fi-name{color:var(--text)}
.lib-filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,rgba(0,229,255,0.03),rgba(124,77,255,0.03))}
.filter-group{display:flex;align-items:center;gap:6px}
.filter-label{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);flex-shrink:0}
.filter-chips{display:flex;gap:4px;flex-wrap:wrap}
.fchip{padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:9px;cursor:pointer;transition:all .15s;font-family:var(--mono)}
.fchip:hover{border-color:var(--cyan);color:var(--cyan)}
.fchip.active{background:rgba(0,229,255,0.12);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,0.15)}
.filter-tools{margin-left:auto}
.file-row.no-play,.file-card.no-play{opacity:.85}
.file-row.no-play .fi-icon,.file-card.no-play .fc-icon{color:var(--text3)}
.codec-badge{position:absolute;top:2px;right:2px;font-size:8px;color:var(--yellow);background:var(--bg3);border:1px solid rgba(255,211,42,0.3);border-radius:3px;padding:0 3px}
.codec-badge.tx{color:var(--green);border-color:rgba(0,255,136,0.35);background:rgba(0,255,136,0.08)}
.codec-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--text2);text-align:center}
.codec-note{margin-top:10px;font-size:10px;color:var(--text3);max-width:420px;text-align:center}
.video-msg .big{font-size:38px}
.sort-btns{display:flex;gap:4px;margin-left:auto}
.sort-btn{padding:4px 9px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:10px;cursor:pointer;transition:all .2s}
.sort-btn:hover{border-color:var(--cyan);color:var(--text)}
.sort-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.08)}
.view-btns{display:flex;gap:4px}
.view-btn{width:26px;height:26px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s}
.view-btn:hover,.view-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.06)}
.file-scroll{flex:1;overflow-y:auto;padding:4px 0}
.file-scroll.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px}
.file-row{display:grid;grid-template-columns:28px 1fr 88px 70px 36px;align-items:center;padding:6px 14px;font-size:12px;border-bottom:1px solid rgba(0,229,255,0.03);cursor:pointer;transition:all .15s;position:relative}
.file-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--cyan),var(--purple));opacity:0;transition:opacity .15s}
.file-row:hover{background:rgba(0,229,255,0.05)}
.file-row.playing{background:linear-gradient(90deg,rgba(0,229,255,0.1),rgba(124,77,255,0.06))}
.file-row.playing::before{opacity:1}
.file-row.playing .fi-icon{color:var(--cyan)}
.file-row.playing .fi-name{color:var(--cyan)}
.file-row .fi-icon{font-size:14px;text-align:center;color:var(--text3);filter:drop-shadow(0 0 4px rgba(0,229,255,0.2))}
.file-row .fi-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.file-row .fi-size{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right}
.file-row .fi-mime{font-family:var(--mono);font-size:9px;color:var(--text3);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .fi-add{opacity:0;font-size:14px;color:var(--cyan);cursor:pointer;transition:opacity .15s;text-align:center}
.file-row:hover .fi-add{opacity:1}
.file-row .fi-share{opacity:0;font-size:11px;color:var(--purple);cursor:pointer;transition:opacity .15s;text-align:center}
.file-row:hover .fi-share{opacity:1}
.file-card .fc-share{display:inline-block;margin-top:6px;font-size:10px;color:var(--purple);cursor:pointer;padding:2px 8px;border:1px solid rgba(124,77,255,0.3);border-radius:3px;opacity:.85;transition:all .2s}
.file-card .fc-share:hover{opacity:1;background:rgba(124,77,255,0.12)}
.zmmx-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(6,8,14,.95);border:1px solid var(--cyan);color:#eee;padding:8px 16px;border-radius:6px;font-size:11px;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.zmmx-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fi-source{font-size:9px;padding:2px 6px;border-radius:3px;text-align:center;font-weight:600;letter-spacing:0.5px}
.fi-source.local{background:rgba(0,229,255,0.1);color:var(--cyan)}
.fi-source.zicore_fs{background:rgba(124,77,255,0.1);color:var(--purple)}
.fi-source.jilocomotion{background:rgba(0,255,136,0.1);color:var(--green)}
.file-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;text-align:center;position:relative;overflow:hidden}
.file-card::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,229,255,0.08),rgba(124,77,255,0.08));opacity:0;transition:opacity .2s}
.file-card:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,229,255,0.12)}
.file-card:hover::before{opacity:1}
.file-card.playing{border-color:var(--green);box-shadow:0 0 18px rgba(0,255,136,0.15)}
.file-card .fc-icon{font-size:30px;margin-bottom:6px;opacity:.65;position:relative;z-index:1;transition:transform .2s,opacity .2s}
.file-card:hover .fc-icon{opacity:1;transform:scale(1.15)}
.file-card .fc-name{font-size:10px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1}
.file-card .fc-meta{font-size:9px;color:var(--text3);margin-top:4px;position:relative;z-index:1}
.load-more-row{padding:10px;text-align:center}
.load-more-btn{padding:8px 20px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--cyan);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s}
.load-more-btn:hover{background:rgba(0,229,255,0.08)}
.empty{text-align:center;padding:50px 16px;color:var(--text3);font-size:13px}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.4}
.loading{text-align:center;padding:50px;color:var(--text3)}
.loading::after{content:'';display:block;width:30px;height:30px;margin:14px auto;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Audio module ── */
.audio-stage{display:flex;flex-direction:column;padding:14px;gap:12px;overflow:auto;flex:1}
.audio-vis-wrap{position:relative;flex:1;min-height:140px;background:radial-gradient(120% 120% at 50% 40%,rgba(124,77,255,0.12),rgba(0,0,0,0) 60%),var(--bg3);border:1px solid var(--border2);border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.audio-vis-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,229,255,0.03),transparent 40%,rgba(124,77,255,0.05));pointer-events:none}
#spectrum{position:absolute;inset:0;width:100%;height:100%;display:none}
.audio-art{font-size:56px;opacity:.5;filter:drop-shadow(0 0 14px rgba(0,229,255,0.25))}
.audio-np{padding:4px}
.audio-np .t{font-size:15px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audio-np .a{font-size:11px;color:var(--text3);margin-top:2px}
.audio-controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;flex-wrap:wrap}
.p-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:linear-gradient(145deg,var(--bg3),#0a0f1c);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,0.04),0 2px 6px rgba(0,0,0,0.4);position:relative;overflow:hidden}
.p-btn::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 0%,rgba(0,229,255,0.15),transparent 60%);opacity:0;transition:opacity .2s}
.p-btn:hover{border-color:var(--cyan);color:var(--cyan);background:linear-gradient(145deg,rgba(0,229,255,0.08),#0a0f1c);box-shadow:0 0 14px rgba(0,229,255,0.25)}
.p-btn:hover::before{opacity:1}
.p-btn.play{width:50px;height:50px;border:2px solid var(--cyan);color:var(--cyan);background:linear-gradient(145deg,rgba(0,229,255,0.14),rgba(124,77,255,0.12));font-size:20px;box-shadow:0 0 18px rgba(0,229,255,0.25),inset 0 0 14px rgba(0,229,255,0.08)}
.p-btn.play:hover{background:linear-gradient(145deg,rgba(0,229,255,0.22),rgba(124,77,255,0.18));box-shadow:0 0 24px rgba(0,229,255,0.45),inset 0 0 16px rgba(0,229,255,0.12)}
.p-btn.play .play-ic{display:inline-block;transform:translateX(1px)}
#app.is-playing .p-btn.play .play-ic{animation:playPulse 1.6s ease-in-out infinite}
#app.is-playing .p-btn.play{border-color:var(--green);color:var(--green);box-shadow:0 0 20px rgba(0,255,136,0.35),inset 0 0 14px rgba(0,255,136,0.08)}
.p-btn.active{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,0.2)}
.p-btn.eq-btn{width:30px;height:30px;font-size:14px;color:var(--purple)}
.p-btn.eq-btn:hover{border-color:var(--purple);color:var(--purple);box-shadow:0 0 12px rgba(124,77,255,0.3)}
.eq-ic{transform:scaleX(0.9) translateY(-1px);display:inline-block}
.eq-dot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--purple);box-shadow:0 0 6px var(--purple);opacity:0;transition:opacity .2s}
.eq-btn.on .eq-dot{opacity:1}
@keyframes playPulse{0%,100%{transform:translateX(1px) scale(1)}50%{transform:translateX(1px) scale(1.15)}}
.seek-wrap{display:flex;align-items:center;gap:10px;max-width:640px;width:100%;margin:0 auto}
.progress-bar{flex:1;height:5px;background:var(--bg4);border-radius:3px;cursor:pointer;position:relative;transition:height .15s}
.progress-bar:hover{height:7px}
.progress-bar:hover .progress-fill{box-shadow:0 0 10px rgba(0,229,255,0.4)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:3px;width:0;transition:background .3s}
.progress-fill::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,0.8);opacity:0;transition:opacity .15s}
.progress-bar:hover .progress-fill::after{opacity:1}
.progress-time{font-family:var(--mono);font-size:10px;color:var(--text3);min-width:36px;text-align:center}

/* ── Playlist panel ── */
.pl-panel{background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0}
.pl-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.pl-h .t{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);font-weight:700}
.pl-h .c{font-size:10px;color:var(--text3);font-family:var(--mono)}
.pl-list{flex:1;overflow-y:auto;padding:4px 0}
.pl-item{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:11px;border-bottom:1px solid rgba(0,229,255,0.03);cursor:pointer;transition:background .1s}
.pl-item:hover{background:rgba(0,229,255,0.04)}
.pl-item.active{background:rgba(0,229,255,0.08);border-left:2px solid var(--cyan)}
.pl-item .num{font-family:var(--mono);font-size:10px;color:var(--text3);width:18px;text-align:right;flex-shrink:0}
.pl-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.pl-item.active .nm{color:var(--cyan)}
.pl-item .icon{flex-shrink:0;font-size:11px;opacity:.6}
.pl-item .rm{opacity:0;color:var(--red);cursor:pointer;font-size:12px;flex-shrink:0;transition:opacity .15s}
.pl-item:hover .rm{opacity:1}
.pl-empty{text-align:center;padding:40px 16px;color:var(--text3);font-size:12px}
.pl-empty .big{font-size:30px;margin-bottom:8px;opacity:.4}
.pl-actions{padding:8px 14px;border-top:1px solid var(--border);display:flex;gap:6px}
.pl-btn{flex:1;padding:6px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.pl-btn:hover{border-color:var(--cyan);color:var(--text)}
.pl-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* ── EQ panel ── */
.eq-panel{position:fixed;bottom:74px;right:16px;width:360px;background:var(--glass2);border:1px solid var(--border2);border-radius:10px;padding:14px;backdrop-filter:blur(16px);z-index:100;display:none;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.eq-panel.open{display:block}
.eq-panel .eq-title{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--cyan);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.eq-row{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.eq-row label{width:32px;font-size:9px;color:var(--text3);text-align:right;flex-shrink:0}
.eq-row input[type=range]{flex:1;height:3px;-webkit-appearance:none;background:var(--bg4);border-radius:2px;outline:none}
.eq-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg2);cursor:pointer}
.eq-row input[type=range]::-webkit-slider-thumb:hover{background:var(--purple)}
.eq-row .eq-val{width:26px;font-size:9px;color:var(--text2);font-family:var(--mono);text-align:center;flex-shrink:0}
.eq-presets{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.eq-presets button{padding:3px 8px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:9px;cursor:pointer;transition:all .2s}
.eq-presets button:hover,.eq-presets button.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.08)}
.eq-on-label{font-size:9px;color:var(--green);font-weight:700}

/* ── Video (teatro) ── */
.video-wrap{display:flex;flex-direction:column;height:100%;background:#000}
.video-stage{flex:1;display:flex;align-items:center;justify-content:center;background:#000;padding:8px;overflow:hidden;min-height:0}
#videoEl{max-width:100%;max-height:100%;border-radius:6px;outline:none;background:#000}
.video-msg{color:var(--text3);font-size:13px;text-align:center;padding:24px}
.video-msg .big{font-size:40px;opacity:.4;margin-bottom:10px}

/* ── Gallery ── */
.gallery-scroll{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.g-item{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;cursor:pointer;border:1px solid var(--border);background:var(--bg3)}
.g-item img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.g-item:hover img{transform:scale(1.05)}
.g-item .g-name{position:absolute;bottom:0;left:0;right:0;padding:4px 6px;font-size:9px;color:var(--text);background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:82vh;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.7)}
.lightbox .lb-caption{color:var(--text2);font-size:12px;margin-top:12px;max-width:80vw;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--border2);background:rgba(0,0,0,.5);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.lb-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.lb-prev{left:20px}.lb-next{right:20px}
.lb-close{position:absolute;top:16px;right:20px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:rgba(0,0,0,.5);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-close:hover{color:var(--red);border-color:var(--red)}
.lb-count{position:absolute;top:20px;left:24px;color:var(--text3);font-family:var(--mono);font-size:12px}

/* ── Share ── */
.share-panel{position:fixed;bottom:80px;right:16px;width:330px;background:var(--glass2);border:1px solid var(--border2);border-radius:10px;padding:14px;backdrop-filter:blur(16px);z-index:200;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.share-panel.open{display:block}
.share-title{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--cyan);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.share-media{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.share-btn{border:1px solid var(--border);background:var(--bg3);color:var(--text2);border-radius:6px;padding:7px;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.share-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.06)}
.share-btn .sb-ic{font-size:13px}
.share-btn.wa:hover{border-color:#25d366;color:#25d366;background:rgba(37,211,102,.08)}
.share-btn.tg:hover{border-color:#229ed9;color:#229ed9;background:rgba(34,158,217,.08)}
.share-btn.x:hover{border-color:#1da1f2;color:#1da1f2;background:rgba(29,161,242,.08)}
.share-btn.fb:hover{border-color:#1877f2;color:#1877f2;background:rgba(24,119,242,.08)}
.share-btn.cp:hover{border-color:var(--green);color:var(--green);background:rgba(0,255,136,.06)}
.share-btn.embed:hover{border-color:var(--purple);color:var(--purple);background:rgba(124,77,255,.08)}
.share-btn.sm{padding:4px 10px;font-size:9px}
.share-url-row{display:flex;gap:6px;margin-top:10px}
.share-url-row input{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text2);font-family:var(--mono);font-size:9px;padding:6px 8px;outline:none}
.share-url-row input:focus{border-color:var(--cyan)}
.share-embed{margin-top:8px}
.share-embed textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text3);font-family:var(--mono);font-size:9px;padding:6px 8px;resize:vertical;outline:none;box-sizing:border-box}
.share-embed textarea:focus{border-color:var(--purple)}
.share-embed .share-btn{margin-top:6px;width:100%}

/* ── Docs ── */
.docs-scroll{flex:1;overflow-y:auto;padding:10px}
.doc-row{display:flex;align-items:center;gap:12px;padding:9px 14px;font-size:12px;border-bottom:1px solid rgba(0,229,255,0.03);cursor:pointer;transition:background .1s}
.doc-row:hover{background:rgba(0,229,255,0.04)}
.doc-row .di{font-size:18px;flex-shrink:0}
.doc-row .dn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.doc-row .dm{font-size:10px;color:var(--text3);font-family:var(--mono);flex-shrink:0}
#docFrame{flex:1;border:none;background:#fff;width:100%;height:100%}

/* ── Models (3D) ── */
.models-scroll{flex:1;overflow-y:auto;padding:10px}
.models-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:2px}
.model-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 10px;cursor:pointer;transition:all .2s;text-align:center;position:relative;overflow:hidden}
.model-card:hover{border-color:var(--purple);transform:translateY(-3px);box-shadow:0 8px 24px rgba(124,77,255,0.15)}
.model-card .mc-icon{font-size:34px;margin-bottom:8px;filter:drop-shadow(0 0 8px rgba(124,77,255,0.35));opacity:.9}
.model-card .mc-name{font-size:10px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-card .mc-meta{font-size:9px;color:var(--text3);margin-top:4px;font-family:var(--mono);text-transform:uppercase}
.model-card .mc-badge{position:absolute;top:6px;right:6px;font-size:8px;color:var(--cyan);border:1px solid rgba(0,229,255,0.35);background:rgba(0,229,255,0.08);border-radius:3px;padding:1px 5px;font-family:var(--mono)}
.model-card .mc-badge.alt{color:var(--purple);border-color:rgba(124,77,255,0.4);background:rgba(124,77,255,0.1)}
.model-viewer{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:radial-gradient(120% 120% at 50% 30%,rgba(124,77,255,0.1),rgba(0,0,0,0) 60%),#05070d}
.model-canvas{flex:1;min-height:0;width:100%}
.model-canvas canvas{display:block}
.model-hud{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(6,8,14,.8);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;backdrop-filter:blur(6px)}
.model-hud .mh-btn{padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:10px;cursor:pointer;transition:all .2s;font-family:var(--mono)}
.model-hud .mh-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.model-hud .mh-btn.active{background:rgba(0,229,255,0.12);border-color:var(--cyan);color:var(--cyan)}
.model-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px;gap:10px;z-index:2}
.model-loading::after{content:'';width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite}
.model-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3);font-size:12px;z-index:2;text-align:center;padding:20px}
.model-error .big{font-size:38px;opacity:.5}
.model-info-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(0,229,255,0.03);font-size:11px;color:var(--text2);flex-wrap:wrap}
.model-info-row .tag{padding:2px 8px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.5px;font-family:var(--mono)}
.model-info-row .tag.model{background:rgba(124,77,255,0.12);color:var(--purple)}
.model-info-row .tag.native{background:rgba(0,229,255,0.1);color:var(--cyan)}
.model-info-row .tag.raw{background:rgba(255,211,42,0.1);color:var(--yellow)}

/* Thumbnails + converted state */
.model-card .mc-thumb{width:100%;height:90px;object-fit:contain;border-radius:5px;background:radial-gradient(120% 120% at 50% 40%,rgba(124,77,255,0.14),rgba(0,0,0,0) 65%);margin-bottom:8px;border:1px solid rgba(124,77,255,0.18)}
.model-card.converted{border-color:rgba(0,229,255,0.3)}
.model-card.converted:hover{border-color:var(--cyan)}
.model-card .mc-badge.glb-badge{left:6px;right:auto;color:var(--green);border-color:rgba(0,255,136,0.4);background:rgba(0,255,136,0.08)}
.model-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.model-actions .mh-btn{padding:7px 16px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;transition:all .2s;font-family:var(--mono)}
.model-actions .mh-btn:hover{border-color:var(--cyan);color:var(--cyan)}

/* ── Player bar ── */
.playerbar{height:62px;flex-shrink:0;background:var(--glass);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px;z-index:30}
.pb-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.pb-art{width:42px;height:42px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;overflow:hidden;transition:border-color .3s,box-shadow .3s}
#app.is-playing .pb-art{border-color:var(--cyan);box-shadow:0 0 14px rgba(0,229,255,0.25);animation:artPulse 2.4s ease-in-out infinite}
#app.is-playing .playerbar{border-top-color:rgba(0,229,255,0.22)}
@keyframes artPulse{0%,100%{box-shadow:0 0 10px rgba(0,229,255,0.2)}50%{box-shadow:0 0 20px rgba(124,77,255,0.35)}}
.pb-meta{min-width:0}
.pb-title{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-sub{font-size:10px;color:var(--text3);margin-top:2px}
.pb-controls{display:flex;align-items:center;gap:8px}
.pb-controls .p-btn{width:30px;height:30px;font-size:13px}
.pb-controls .p-btn.play{width:42px;height:42px;font-size:17px}
.pb-progress{display:flex;align-items:center;gap:8px;flex:1;max-width:400px}
.pb-progress .progress-time{min-width:32px}
.pb-eqbar{display:flex;align-items:flex-end;gap:2px;height:16px;width:34px;flex-shrink:0}
.pb-eqbar .b{width:3px;background:var(--cyan);border-radius:1px;height:6px;transition:height .12s;box-shadow:0 0 4px rgba(0,229,255,0.4)}
.pb-eqbar .b:nth-child(2){background:var(--purple);box-shadow:0 0 4px rgba(124,77,255,0.4)}
.pb-eqbar .b:nth-child(3){background:var(--green);box-shadow:0 0 4px rgba(0,255,136,0.4)}
.pb-eqbar .b:nth-child(4){background:var(--cyan);box-shadow:0 0 4px rgba(0,229,255,0.4)}
.pb-eqbar .b:nth-child(5){background:var(--purple);box-shadow:0 0 4px rgba(124,77,255,0.4)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,229,255,0.2)}

@media(max-width:820px){.src-chips{display:none}.nav-tabs{max-width:60vw}.search-box{max-width:200px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo" onclick="Panels.toggle('library')">
      <svg viewBox="0 0 100 100"><polygon points="50,3 93,25 93,75 50,97 7,75 7,25" fill="none" stroke="url(#hg2)" stroke-width="3"/><defs><linearGradient id="hg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#7c4dff"/></linearGradient></defs></svg>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════════
   ZMMX — Librería multimedia modular estilo Winamp.
   Cada módulo es una VENTANA independiente: arrastrable, redimensionable,
   escalable y ocultable desde el selector (⊞). Se registran en
   ZMMX.modules y se gestionan con Panels.
   ════════════════════════════════════════════════════════════════════════ */

var ZMMX = {
  modules: {},
  state: {
    lib: { category: 'music', source: 'all', sort: 'name', order: 'asc', view: 'list', q: '', dir: '', explore: false, offset: 0, total: 0, filters: { ext: '', sizeMin: 0, fresh: false } },
    gallery: { offset: 0, items: [], index: 0 },
    categories: {}, grandTotal: 0,
    vol: (function(){
      try{
        var u=JSON.parse(localStorage.getItem('zicore_sso_user')||'null');
        var user=(u&&u.username)?u.username:'guest';
        var v=parseFloat(localStorage.getItem('zc_zmmx_vol_'+user));
        if(isNaN(v))v=0.85;
        return v;
      }catch(e){return 0.85;}
    })()
  }
};

/* ── Utilidades ── */
ZMMX.utils = {
  fmtSize: function(b){
    if (!b && b !== 0) return '?';
    var u = ['B','KB','MB','GB','TB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
  },
  fmtTime: function(s){
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  },
  esc: function(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; },
  ext: function(f){ return ((f.ext || '').replace(/^\./,'') || (f.name || '').split('.').pop()).toLowerCase(); },
  mime: function(f){
    var e = ZMMX.utils.ext(f);
    var map = { mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', flac:'audio/flac', m4a:'audio/mp4', aac:'audio/aac',
      mp4:'video/mp4', webm:'video/webm', mov:'video/quicktime', mkv:'video/x-matroska', mks:'video/x-matroska', avi:'video/x-msvideo', m4v:'video/mp4',
      srt:'application/x-subrip', vtt:'text/vtt', ass:'text/x-ssa', ssa:'text/x-ssa', sub:'text/x-subviewer', idx:'text/x-dvd-subtitle',
      png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', bmp:'image/bmp', svg:'image/svg+xml',
      pdf:'application/pdf', epub:'application/epub+zip' };
    return map[e] || f.mime || 'application/octet-stream';
  },
  type: function(f){
    var e = ZMMX.utils.ext(f);
    if (/^(mp3|wav|ogg|flac|m4a|aac)$/.test(e)) return 'audio';
    if (/^(mp4|webm|mov|mkv|avi|m4v|3gp|mks)$/.test(e)) return 'video';
    if (/^(srt|vtt|ass|ssa|sub|idx)$/.test(e)) return 'sub';
    if (/^(png|jpg|jpeg|gif|webp|bmp|svg)$/.test(e)) return 'image';
    if (/^(pdf|epub|djvu|txt|doc|docx|mobi)$/.test(e)) return 'doc';
    return 'other';
  },
  icon: function(f){
    var t = ZMMX.utils.type(f);
    return t === 'audio' ? '🎵' : t === 'video' ? '🎬' : t === 'sub' ? '💬' : t === 'image' ? '🖼️' : t === 'doc' ? '📄' : '📦';
  },
  getUrl: function(f, opts){
    opts = opts || {};
    var u = f.url;
    if (!u) {
      if (f.source === 'jilocomotion') u = '/api/jilocomotion/serve?path=' + encodeURIComponent(f.path);
      else if (f.path) u = '/api/media/serve?path=' + encodeURIComponent(f.path);
    }
    if (opts.stream) return ZMMX.utils.streamUrl(f, u);
    return u || '';
  },
  streamUrl: function(f, fallbackUrl){
    var e = ZMMX.utils.ext(f);
    var src = f.source || 'local';
    var p = f.path || '';
    var base = '/api/zmmx/stream?source=' + encodeURIComponent(src) + '&path=' + encodeURIComponent(p);
    var isSub = /^(srt|vtt|ass|ssa|sub|idx|mks)$/.test(e);
    if (isSub) return base;
    var isAudio = /^(mp3|wav|ogg|m4a|aac|flac|aiff|aif|wma|opus|amr|ape|alac|mid|midi)$/.test(e);
    var isVideo = /^(mp4|webm|ogv|mov|mkv|mks|avi|m4v|3gp|ts|flv|wmv|mpg|mpeg|m2ts|vob|ogm)$/.test(e);
    if (!isAudio && !isVideo) return fallbackUrl || ZMMX.utils.getUrl(f);
    var native = isAudio ? (ZMMX.utils.audioCodecs.indexOf(e) !== -1) : (ZMMX.utils.videoCodecs.indexOf(e) !== -1);
    if (native) return fallbackUrl || (f.url ? f.url : ZMMX.utils.getUrl(f));
    return base + '&transcode=1';
  },
  audioCodecs: (function(){
    var a = document.createElement('audio');
    return ['mp3','aac','wav','ogg','flac','m4a'].filter(function(e){
      var m = { mp3:'audio/mpeg', aac:'audio/aac', wav:'audio/wav', ogg:'audio/ogg', flac:'audio/flac', m4a:'audio/mp4' }[e];
      try { return a.canPlayType(m); } catch(err){ return false; }
    });
  })(),
  videoCodecs: (function(){
    var v = document.createElement('video');
    return ['mp4','webm','mov','mkv','avi','m4v'].filter(function(e){
      var m = { mp4:'video/mp4', webm:'video/webm', mov:'video/quicktime', mkv:'video/x-matroska', avi:'video/x-msvideo', m4v:'video/mp4' }[e];
      try { return v.canPlayType(m); } catch(err){ return false; }
    });
  })(),
  nativePlayable: function(f){
    var e = ZMMX.utils.ext(f);
    return ZMMX.utils.type(f) === 'audio' ? ZMMX.utils.audioCodecs.indexOf(e) !== -1
         : ZMMX.utils.type(f) === 'video' ? ZMMX.utils.videoCodecs.indexOf(e) !== -1
         : true;
  },
  transcodable: function(f){
    var e = ZMMX.utils.ext(f);
    var audioTx = /^(flac|aiff|aif|wma|opus|amr|ape|alac|mid|midi)$/.test(e);
    var videoTx = /^(mkv|avi|mov|m4v|ts|m2ts|mpg|mpeg|wmv|flv|3gp|ogm|vob)$/.test(e);
    return audioTx || videoTx;
  }
};

ZMMX.api = async function(path){
  var r = await fetch(path);
  return r.json();
};

ZMMX.registerModule = function(name, def){ this.modules[name] = def; };

ZMMX.toast = function(msg){
  var t = document.createElement('div');
  t.className = 'zmmx-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.classList.add('show'); }, 10);
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 300); }, 2200);
};

ZMMX.copyText = function(text, label){
  var ok = function(){ ZMMX.toast(label || 'Enlace copiado'); };
  var fallback = function(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    ta.remove(); ok();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else { fallback(); }
};

ZMMX._share = { url: '', name: '' };

ZMMX.shareFile = function(f){
  var src = f.source || 'local';
  var p = f.path || '';
  ZMMX.api('/api/zmmx/share/link?source=' + encodeURIComponent(src) + '&path=' + encodeURIComponent(p) + '&ttl=30').then(function(r){
    if (!r || !r.url) { ZMMX.toast('No se pudo generar el enlace seguro'); return; }
    var abs;
    try { abs = new URL(r.share_url || r.url, location.origin).href; } catch(e){ abs = location.origin + (r.share_url || r.url); }
    var name = f.name || 'ZICORE media';
    ZMMX._share = { url: abs, name: name };
    var panel = document.getElementById('sharePanel');
    if (!panel) { ZMMX.toast('Compartir no disponible'); return; }
    document.getElementById('shareName').textContent = name;
    document.getElementById('shareUrl').value = abs;
    var emb = document.getElementById('shareEmbed');
    if (emb) { emb.style.display = 'none'; document.getElementById('shareEmbedCode').value = ''; }
    panel.classList.add('open');
  }).catch(function(){
    var u = ZMMX.utils.getUrl(f);
    if (!u) { ZMMX.toast('Sin enlace para compartir'); return; }
    var abs;
    try { abs = new URL(u, location.origin).href; } catch(e){ abs = location.origin + u; }
    var name = f.name || 'ZICORE media';
    ZMMX._share = { url: abs, name: name };
    var panel = document.getElementById('sharePanel');
    if (!panel) { ZMMX.toast('Compartir no disponible'); return; }
    document.getElementById('shareName').textContent = name;
    document.getElementById('shareUrl').value = abs;
    panel.classList.add('open');
  });
};

ZMMX.closeShare = function(){
  var panel = document.getElementById('sharePanel');
  if (panel) panel.classList.remove('open');
};

ZMMX.shareTo = function(target){
  var s = ZMMX._share;
  if (!s.url) return;
  var enc = encodeURIComponent(s.url);
  var txt = encodeURIComponent(s.name);
  var url = '';
  if (target === 'whatsapp') url = 'https://wa.me/?text=' + txt + '%20' + enc;
  else if (target === 'telegram') url = 'https://t.me/share/url?url=' + enc + '&text=' + txt;
  else if (target === 'x') url = 'https://twitter.com/intent/tweet?url=' + enc + '&text=' + txt;
  else if (target === 'facebook') url = 'https://www.facebook.com/sharer/sharer.php?u=' + enc;
  else if (target === 'copy') { ZMMX.copyText(s.url); return; }
  else if (target === 'embed') {
    var emb = document.getElementById('shareEmbed');
    var code = document.getElementById('shareEmbedCode');
    if (emb && code) {
      code.value = '<iframe src="' + s.url + '" width="640" height="400" frameborder="0" allowfullscreen></iframe>';
      emb.style.display = 'block';
      ZMMX.toast('Código de embebido generado');
    }
    return;
  }
  else if (target === 'copyEmbed') {
    var c = document.getElementById('shareEmbedCode');
    if (c) ZMMX.copyText(c.value, 'Código embebido copiado');
    return;
  }
  if (url) { ZMMX.closeShare(); window.open(url, '_blank', 'noopener,width=640,height=520'); }
};

/* ════════════════════════════════════════════════════════════════════════
   PANELS — gestor de ventanas modulares (mostrar/ocultar, mover, escalar)
   ════════════════════════════════════════════════════════════════════════ */
var Panels = {
  order: [],            // ids registrados
  meta: {},             // id -> {title, icon, def}
  win: {},              // id -> {el, head, body}
  defs: {               // defaults de geometría por panel
    library: { x: 0, y: 0, w: 'fill', h: 'fill' },
    audio:   { x: 'right', y: 'bottom', w: 400, h: 430 },
    video:   { x: 90, y: 60, w: 720, h: 460 },
    gallery: { x: 40, y: 40, w: 760, h: 520 },
    docs:    { x: 60, y: 50, w: 700, h: 480 },
    models:  { x: 110, y: 60, w: 820, h: 540 }
  },
  state: { visible: {}, layout: {}, zoom: 1 },
  KEY: 'zmmx_panels',

  register: function(id, title, icon, def){
    this.meta[id] = { title: title, icon: icon, def: (def && def.def) ? def.def : def };
    this.order.push(id);
    if (this.state.visible[id] === undefined) this.state.visible[id] = ((def && def.defaultVisible) !== false);
    if (id === 'library') this.state.visible[id] = true;
  },

  load: function(){
    try {
      var s = JSON.parse(localStorage.getItem(this.KEY) || 'null');
      if (s) { this.state.visible = s.visible || this.state.visible; this.state.layout = s.layout || {}; this.state.zoom = s.zoom || 1; }
    } catch(e){}
    this.applyZoom();
  },
  save: function(){
    try { localStorage.setItem(this.KEY, JSON.stringify({ visible: this.state.visible, layout: this.state.layout, zoom: this.state.zoom })); } catch(e){}
  },

  show: function(id, opts){
    var meta = this.meta[id];
    if (!meta) return;
    this.state.visible[id] = true;
    this.ensureWindow(id);
    this.applyVisibility();
    this.focus(id);
    if (meta.def && meta.def.onShow) meta.def.onShow(opts || {});
  },
  hide: function(id){
    this.state.visible[id] = false;
    this.applyVisibility();
    this.save();
    this.renderTabs();
    this.renderMenu();
  },
  toggle: function(id){
    if (this.state.visible[id]) this.hide(id);
    else this.show(id);
  },

  ensureWindow: function(id){
    if (this.win[id]) return this.win[id].el;
    var meta = this.meta[id];
    var ws = document.getElementById('workspace');
    var el = document.createElement('div');
    el.className = 'panel' + (id === 'library' ? ' filled' : '');
    el.dataset.panel = id;
    el.style.zIndex = 10 + this.order.indexOf(id);
    el.innerHTML =
      '<div class="ph">' +
        '<div class="pt"><span class="dots"><i></i><i></i><i></i></span>' + meta.icon + ' ' + meta.title + '</div>' +
        '<div class="ph-btns">' +
          '<button class="ph-btn max" title="Restaurar tamaño">▣</button>' +
          '<button class="ph-btn close" title="Ocultar">✕</button>' +
        '</div>' +
      '</div>' +
      '<div class="pbody"></div>' +
      '<div class="presize"></div>';
    ws.appendChild(el);
    var body = el.querySelector('.pbody');
    var rec = {};
    this.win[id] = { el: el, body: body, rec: rec };
    // header buttons
    el.querySelector('.ph .close').addEventListener('click', function(){ Panels.hide(id); });
    el.querySelector('.ph .max').addEventListener('click', function(){
      var l = Panels.state.layout[id] || {};
      if (l.maxed) { delete l.maxed; Panels.position(id, el); }
      else { l.maxed = true; l._x = el.style.left; l._y = el.style.top; l._w = el.style.width; l._h = el.style.height; Panels.position(id, el); }
      Panels.save();
    });
    el.addEventListener('mousedown', function(){ Panels.focus(id); });
    this.makeDraggable(el, id);
    this.makeResizable(el, id);
    this.position(id, el);
    // inicializa contenido del módulo
    if (meta.def && meta.def.render) meta.def.render(body);
    return el;
  },

  position: function(id, el){
    var l = this.state.layout[id] || (this.state.layout[id] = {});
    var ws = document.getElementById('workspace');
    var ww = ws.clientWidth || 900, wh = ws.clientHeight || 600;
    var d = this.defs[id];
    var isFill = id === 'library';
    var x = l.x, y = l.y, w = l.w, h = l.h;
    if (l.maxed) {
      el.style.left = '0'; el.style.top = '0'; el.style.width = ww + 'px'; el.style.height = wh + 'px';
      return;
    }
    if (x === undefined) {
      var pos = d && d.w === 'fill' ? { x: 0, y: 0 } : (d && d.x === 'right' ? { x: ww - (d.w + 20) } : { x: (d && d.x) || 20 });
      x = l.x = pos.x !== undefined ? pos.x : 20;
      y = l.y = (d && d.y === 'bottom') ? (wh - (d.h + 14)) : ((d && d.y) || 14);
      w = l.w = (d && d.w === 'fill') ? ww : (d.w || 420);
      h = l.h = (d && d.h === 'fill') ? wh : (d.h || 420);
      if (w === 'fill') w = l.w = ww;
      if (h === 'fill') h = l.h = wh;
    }
    x = Math.max(0, Math.min(x, ww - 60)); y = Math.max(0, Math.min(y, wh - 40));
    if (isFill) { x = 0; y = 0; w = ww; h = wh; }
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.width = w + 'px'; el.style.height = h + 'px';
  },

  makeDraggable: function(el, id){
    var head = el.querySelector('.ph');
    var startX, startY, sx, sy;
    head.addEventListener('mousedown', function(e){
      if (e.target.classList.contains('ph-btn')) return;
      startX = e.clientX; startY = e.clientY;
      sx = parseInt(el.style.left, 10) || 0; sy = parseInt(el.style.top, 10) || 0;
      el.classList.add('drag-over');
      function move(ev){
        el.style.left = Math.max(0, sx + ev.clientX - startX) + 'px';
        el.style.top = Math.max(0, sy + ev.clientY - startY) + 'px';
      }
      function up(){
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        el.classList.remove('drag-over');
        var l = Panels.state.layout[id] || (Panels.state.layout[id] = {});
        l.x = parseInt(el.style.left, 10); l.y = parseInt(el.style.top, 10);
        delete l.maxed;
        Panels.save();
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  },
  makeResizable: function(el, id){
    var rz = el.querySelector('.presize');
    var startX, startY, sw, sh;
    rz.addEventListener('mousedown', function(e){
      e.preventDefault(); e.stopPropagation();
      startX = e.clientX; startY = e.clientY;
      sw = el.offsetWidth; sh = el.offsetHeight;
      function move(ev){
        var w = Math.max(320, sw + (ev.clientX - startX));
        var h = Math.max(240, sh + (ev.clientY - startY));
        el.style.width = w + 'px'; el.style.height = h + 'px';
      }
      function up(){
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        var l = Panels.state.layout[id] || (Panels.state.layout[id] = {});
        l.w = el.offsetWidth; l.h = el.offsetHeight;
        delete l.maxed;
        Panels.save();
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  },

  focus: function(id){
    var w = this.win[id];
    if (!w) return;
    var max = 0;
    this.order.forEach(function(o){ var ww = Panels.win[o]; if (ww) max = Math.max(max, parseInt(ww.el.style.zIndex, 10) || 0); });
    w.el.style.zIndex = max + 1;
  },

  applyVisibility: function(){
    var self = this;
    this.order.forEach(function(id){
      var w = self.win[id];
      if (!w) return;
      w.el.style.display = self.state.visible[id] ? 'flex' : 'none';
    });
    this.save();
    this.renderTabs();
    this.renderMenu();
  },

  renderTabs: function(){
    document.getElementById('navTabs').innerHTML = this.order.map(function(id){
      var m = Panels.meta[id];
      return '<button class="nav-tab' + (Panels.state.visible[id] ? ' active' : '') + '" data-panel="' + id + '" onclick="Panels.toggle(\'' + id + '\')">' + m.icon + ' ' + m.title + '</button>';
    }).join('');
  },

  renderMenu: function(){
    var menu = document.getElementById('mgrMenu');
    if (!menu) return;
    var rows = this.order.map(function(id){
      var m = Panels.meta[id];
      return '<label class="mgr-row"><input type="checkbox" data-p="' + id + '"' + (Panels.state.visible[id] ? ' checked' : '') + '><span class="mgr-icon">' + m.icon + '</span>' + m.title + '</label>';
    }).join('');
    menu.innerHTML =
      '<div class="mgr-title">Selector de módulos</div>' + rows +
      '<div class="mgr-sep"></div>' +
      '<div class="mgr-zoom"><span>Escala UI</span><input type="range" id="zoomRange" min="70" max="150" step="5" value="' + Math.round(this.state.zoom * 100) + '" oninput="Panels.setZoom(this.value)"><b id="zoomVal">' + Math.round(this.state.zoom * 100) + '%</b></div>' +
      '<button class="mgr-reset" onclick="Panels.reset()">↺ Restaurar layout</button>';
    menu.querySelectorAll('input[type=checkbox]').forEach(function(cb){
      cb.addEventListener('change', function(){ Panels.toggle(cb.dataset.p); });
    });
  },

  toggleMenu: function(e){
    if (e) { e.stopPropagation(); }
    var menu = document.getElementById('mgrMenu');
    menu.classList.toggle('open');
    this.renderMenu();
  },

  setZoom: function(v){
    this.state.zoom = parseInt(v, 10) / 100;
    this.applyZoom();
    this.save();
    var l = document.getElementById('zoomVal');
    if (l) l.textContent = parseInt(v, 10) + '%';
  },
  applyZoom: function(){
    var app = document.getElementById('app');
    app.style.zoom = (this.state.zoom * 100) + '%';
  },

  reset: function(){
    this.state.layout = {};
    this.state.visible = { library: true };
    this.order.forEach(function(id){ if (id !== 'library') Panels.state.visible[id] = (Panels.defs[id] && Panels.defs[id].defaultVisible !== false); });
    this.state.zoom = 1;
    this.applyZoom();
    var l = document.getElementById('zoomRange'); if (l) l.value = 100;
    var z = document.getElementById('zoomVal'); if (z) z.textContent = '100%';
    this.order.forEach(function(id){
      var w = Panels.win[id];
      if (w) { delete Panels.state.layout[id]; Panels.position(id, w.el); }
    });
    this.applyVisibility();
    this.save();
  }
};

  },
  load: function(){
    var self = this, st = ZMMX.state.lib;
    var list = document.getElementById('libFiles');
    if (!list) return;
    if (st.offset === 0) list.innerHTML = '<div class="loading">Cargando...</div>';
    document.getElementById('libTitle').textContent = st.explore
      ? 'Explorador · ' + st.source + (st.dir ? ' / ' + st.dir : '')
      : (st.category.charAt(0).toUpperCase() + st.category.slice(1)) + (st.q ? ' · "' + st.q + '"' : '');
    var upBtn = document.querySelector('.tb-upload');
    if (upBtn) {
      upBtn.innerHTML = st.explore ? '⬆ Importar aquí' : '⬆ Cargar';
      upBtn.title = st.explore ? 'Importar archivos a ' + (st.dir || st.source) : 'Subir multimedia';
    }
    document.getElementById('libCount').textContent = '…';
    this.renderCrumbs();
    var url;
    if (st.explore) {
      url = '/api/zmmx/dir?source=' + encodeURIComponent(st.source) + '&path=' + encodeURIComponent(st.dir || '');
    } else if (st.q) {
      url = '/api/zmmx/search?q=' + encodeURIComponent(st.q) + '&category=' + st.category + '&source=' + st.source + '&offset=' + st.offset + '&limit=100';
    } else {
      url = '/api/zmmx/browse?category=' + st.category + '&source=' + st.source + '&sort=' + st.sort + '&order=' + st.order + '&offset=' + st.offset + '&limit=100';
    }
    ZMMX.api(url).then(function(r){
      if (st.explore) {
        list.innerHTML = '';
        list.classList.toggle('grid-view', false);
        var dirs = r.dirs || [];
        var items = r.items || r.files || [];
        st.total = r.total || items.length;
        if (!dirs.length && !items.length) {
          list.innerHTML = '<div class="empty"><div class="big">📂</div>Carpeta vacía</div>';
          document.getElementById('libCount').textContent = '0';
          self.renderCrumbs();
          return;
        }
        dirs.forEach(function(d){
          var el = document.createElement('div');
          el.className = 'file-row dir-row';
          el.innerHTML = '<span class="fi-icon">📁</span>' +
            '<span class="fi-name">' + ZMMX.utils.esc(d.name) + '</span>' +
            '<span class="fi-size" style="color:var(--text3)">carpeta</span>' +
            '<span class="fi-mime">—</span>' +
            '<span class="fi-add" style="opacity:0">➔</span>';
          el.addEventListener('click', function(){ self.openDir(d.path); });
          list.appendChild(el);
        });
        self.appendRows(list, items);
        document.getElementById('libCount').textContent = (dirs.length + items.length).toLocaleString() + ' elementos';
        self.renderCrumbs();
        return;
      }
      var items = st.q ? (r.results || []) : (r.items || []);
      st.total = r.total || items.length;
      if (st.offset === 0) {
        list.innerHTML = '';
        list.classList.toggle('grid-view', st.view === 'grid');
      }
      if (!items.length && st.offset === 0) {
        list.innerHTML = '<div class="empty"><div class="big">📁</div>Sin resultados</div>';
        document.getElementById('libCount').textContent = '0';
        return;
      }
      self.appendRows(list, items);
      if (st.offset + items.length < st.total) {
        var more = document.createElement('div');
        more.className = 'load-more-row';
        more.innerHTML = '<button class="load-more-btn">Cargar más (' + Math.min(100, st.total - st.offset - items.length) + ' más)</button>';
        more.querySelector('button').addEventListener('click', function(){ st.offset += items.length; self.load(); });
        list.appendChild(more);
      }
      document.getElementById('libCount').textContent = st.total.toLocaleString() + ' elementos';
    }).catch(function(){ list.innerHTML = '<div class="empty"><div class="big">⚠️</div>Error cargando</div>'; });
  },
  renderCrumbs: function(){
    var cr = document.getElementById('tbCrumbs');
    var up = document.getElementById('tbUp');
    if (!cr) return;
    var st = ZMMX.state.lib;
    if (!st.explore || !st.dir) {
      cr.innerHTML = '';
      if (up) up.style.display = 'none';
      return;
    }
    if (up) up.style.display = 'inline-flex';
    var parts = st.dir.split('/');
    var acc = '', html = '<span class="crumb" onclick="ZMMX.modules.library.openDir(\'\')">↳ ' + ZMMX.utils.esc(ZMMX.state.lib.source) + '</span>';
    parts.forEach(function(p, i){
      if (!p) return;
      acc = acc ? acc + '/' + p : p;
      html += '<span class="crumb-sep">/</span><span class="crumb" onclick="ZMMX.modules.library.openDir(\'' + acc.replace(/'/g, "\\'") + '\')">' + ZMMX.utils.esc(p) + '</span>';
    });
    cr.innerHTML = html;
  },
  openUpload: function(){
    var st = ZMMX.state.lib;
    var defCat = st.explore ? 'music' : st.category;
    var input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    var self = this;
    input.onchange = function(){
      var files = Array.prototype.slice.call(input.files || []);
      if (!files.length) return;
      var cat = st.explore ? st.dir.split('/')[0] || 'music' : st.category;
      self.doUpload(files, cat, st.explore ? (st.dir.split('/').slice(1).join('/') || '') : '');
    };
    input.click();
  },
  doUpload: function(files, category, subdir){
    var self = this, done = 0, ok = 0;
    files.forEach(function(file){
      var fd = new FormData();
      fd.append('file', file);
      fd.append('category', category);
      fd.append('subdir', subdir || '');
      fetch('/api/zmmx/upload', { method: 'POST', body: fd })
        .then(function(r){ return r.json(); })
        .then(function(res){
          done++; ok++;
          if (res.status !== 'ok') { ok--; ZMMX.toast('Fallo: ' + (res.error || file.name)); }
          if (done === files.length) {
            ZMMX.toast(ok + '/' + files.length + ' archivos subidos a ' + category + (subdir ? '/' + subdir : ''));
            self.load();
            self.renderTree();
          }
        })
        .catch(function(){ done++; if (done === files.length) { ZMMX.toast('Carga incompleta'); self.load(); } });
    });
  },
  toggleFilters: function(){
    var panel = document.getElementById('libFilters');
    if (!panel) return;
    var show = panel.style.display === 'none';
    panel.style.display = show ? 'flex' : 'none';
    if (show) this.renderFilters();
  },
  renderFilters: function(){
    var panel = document.getElementById('libFilters');
    if (!panel) return;
    var f = ZMMX.state.lib.filters;
    var exts = ['','mp3','wav','flac','ogg','m4a','mp4','mkv','webm','mov','mks','srt','vtt','ass','png','jpg','jpeg','gif','webp','pdf','epub'];
    var sizeOpts = [['', 'Cualquier tamaño'],['100KB','Mayor a 100 KB'],['1MB','Mayor a 1 MB'],['10MB','Mayor a 10 MB'],['100MB','Mayor a 100 MB']];
    panel.innerHTML =
      '<div class="filter-group"><span class="filter-label">Formato</span><div class="filter-chips">' +
        exts.map(function(e){ return '<button class="fchip' + (f.ext === e ? ' active' : '') + '" data-v="' + e + '" onclick="ZMMX.modules.library.setFilter(\'ext\',\'' + e + '\')">' + (e || 'Todo') + '</button>'; }).join('') +
      '</div></div>' +
      '<div class="filter-group"><span class="filter-label">Tamaño</span><div class="filter-chips">' +
        sizeOpts.map(function(o){ return '<button class="fchip' + (String(f.sizeMin) === o[0] ? ' active' : '') + '" data-v="' + o[0] + '" onclick="ZMMX.modules.library.setFilter(\'sizeMin\',\'' + o[0] + '\')">' + o[1] + '</button>'; }).join('') +
      '</div></div>' +
      '<div class="filter-group filter-tools"><button class="fchip" onclick="ZMMX.modules.library.resetFilters()">↺ Limpiar</button></div>';
  },
  setFilter: function(key, val){
    if (key === 'sizeMin') {
      var map = { '': 0, '100KB': 100*1024, '1MB': 1024*1024, '10MB': 10*1024*1024, '100MB': 100*1024*1024 };
      ZMMX.state.lib.filters.sizeMin = map[val] || 0;
    } else {
      ZMMX.state.lib.filters.ext = val;
    }
    ZMMX.state.lib.offset = 0;
    this.renderFilters();
    this.load();
  },
  resetFilters: function(){
    ZMMX.state.lib.filters = { ext: '', sizeMin: 0, fresh: false };
    ZMMX.state.lib.offset = 0;
    this.renderFilters();
    this.load();
  },
  passesFilters: function(f){
    var fl = ZMMX.state.lib.filters;
    if (fl.ext && ZMMX.utils.ext(f) !== fl.ext) return false;
    if (fl.sizeMin && (f.size || 0) < fl.sizeMin) return false;
    return true;
  },
  openCodecs: function(){
    var panel = document.getElementById('libFilters');
    if (panel) panel.style.display = 'none';
    ZMMX.toast('🎞️ Codecs — toca una pista incompatible y elige "Descargar"');
    var stage = document.querySelector('.video-stage');
    var vid = document.getElementById('videoEl');
    if (stage && vid) {
      stage.innerHTML =
        '<div class="video-msg"><div class="big">🎞️</div>Codecs soportados por este navegador' +
        '<div class="codec-list">' +
          '<div><b>Audio</b> · ' + ZMMX.utils.audioCodecs.join(' · ') + '</div>' +
          '<div><b>Video</b> · ' + ZMMX.utils.videoCodecs.join(' · ') + '</div>' +
        '</div>' +
        '<div class="codec-note">Los formatos sin soporte nativo (FLAC/OGG/MKV/AVI) se reproducen automáticamente vía transcodificación en vivo (↻). Usa "Descargar" si quieres el archivo original.</div>' +
        '<button class="load-more-btn" style="margin-top:12px" onclick="ZMMX.modules.video.closeMsg()">Cerrar</button>' +
        '</div>';
    } else {
      ZMMX.toast('Audio: ' + ZMMX.utils.audioCodecs.join(' · ') + ' | Video: ' + ZMMX.utils.videoCodecs.join(' · '));
    }
  },
  appendRows: function(list, items){
    var self = this, st = ZMMX.state.lib;
    var shown = 0;
    items.forEach(function(f){
      if (!self.passesFilters(f)) return;
      shown++;
      var el = document.createElement('div');
      var icon = ZMMX.utils.icon(f);
      var native = ZMMX.utils.nativePlayable(f);
      var playable = native || ZMMX.utils.transcodable(f);
      var badge = playable ? '' : '<div class="codec-badge" title="Formato sin soporte nativo">⬇</div>';
      var badgeNote = native ? '' : (ZMMX.utils.type(f) === 'audio' || ZMMX.utils.type(f) === 'video') ? '<div class="codec-badge tx" title="Reproducción vía transcodificación">↻</div>' : '';
      if (st.view === 'grid') {
        el.className = 'file-card' + (playable ? '' : ' no-play');
        el.innerHTML = '<div class="fc-icon">' + icon + badge + badgeNote + '</div><div class="fc-name" title="' + ZMMX.utils.esc(f.name) + '">' + ZMMX.utils.esc(f.name) + '</div><div class="fc-meta">' + ZMMX.utils.fmtSize(f.size) + ' · <span class="fi-source ' + f.source + '">' + f.source + '</span></div><div class="fc-share" title="Compartir">🔗 Compartir</div>';
      } else {
        el.className = 'file-row' + (playable ? '' : ' no-play');
        el.innerHTML = '<span class="fi-icon">' + icon + badge + badgeNote + '</span>' +
          '<span class="fi-name" title="' + ZMMX.utils.esc(f.name) + '">' + ZMMX.utils.esc(f.name) + '</span>' +
          '<span class="fi-size">' + ZMMX.utils.fmtSize(f.size) + '</span>' +
          '<span class="fi-mime">' + ZMMX.utils.mime(f).split('/')[1] + '</span>' +
          '<span class="fi-share" title="Compartir">🔗</span>' +
          (playable ? '<span class="fi-add" title="Añadir a playlist">+</span>' : '<span class="fi-add" title="Descargar">⬇</span>');
      }
      el._file = f;
      el.addEventListener('click', function(e){
        var t = e.target;
        if (t.classList && (t.classList.contains('fi-share') || t.classList.contains('fc-share'))) {
          e.stopPropagation();
          ZMMX.shareFile(f);
          return;
        }
        if (t.classList && t.classList.contains('fi-add')) {
          e.stopPropagation();
          if (playable) { Player.enqueue(f); return; }
          var a2 = document.createElement('a');
          a2.href = ZMMX.utils.getUrl(f); a2.download = f.name; a2.target = '_blank';
          document.body.appendChild(a2); a2.click(); a2.remove();
          return;
        }
        if (!playable) {
          ZMMX.toast('Formato sin soporte — usa ⬇ para descargar');
          return;
        }
        self.activate(f);
      });
      list.appendChild(el);
    });
    if (!shown && st.offset === 0) {
      list.innerHTML = '<div class="empty"><div class="big">🔍</div>Nada coincide con los filtros</div>';
    }
    if (shown) Player.markPlaying();
  },
  activate: function(f){
    var t = ZMMX.utils.type(f);
    if (t === 'image') { Panels.show('gallery', { file: f }); }
    else if (t === 'doc') { Panels.show('docs', { file: f }); }
    else { Player.playFile(f, true); }
  }
});

/* ════════════════════════════════════════════════════════════════════════
   MÓDULO: Galería
   ════════════════════════════════════════════════════════════════════════ */
var Gallery = {
  open: function(f){
    var items = ZMMX.state.gallery.items, idx = items.indexOf(f);
    ZMMX.state.gallery.index = idx >= 0 ? idx : 0;
    Gallery.show();
  },
  show: function(){
    var items = ZMMX.state.gallery.items, i = ZMMX.state.gallery.index;
    if (!items.length) return;
    var lb = document.getElementById('lightbox');
    document.getElementById('lbImg').src = ZMMX.utils.getUrl(items[i]);
    document.getElementById('lbCaption').textContent = items[i].name;
    document.getElementById('lbCount').textContent = (i + 1) + ' / ' + items.length;
    lb.classList.add('open');
  },
  step: function(d){
    var items = ZMMX.state.gallery.items;
    if (!items.length) return;
    ZMMX.state.gallery.index = (ZMMX.state.gallery.index + d + items.length) % items.length;
    Gallery.show();
  },
  close: function(){ document.getElementById('lightbox').classList.remove('open'); }
};

ZMMX.registerModule('gallery', {
  render: function(body){
    body.innerHTML =
      '<div class="lib-toolbar" style="flex-shrink:0">' +
        '<span class="title">Galería de imágenes</span>' +
        '<span class="count" id="galCount">0</span>' +
        '<button class="sort-btn" style="margin-left:auto" onclick="ZMMX.modules.gallery.loadMore()">Cargar más</button>' +
      '</div>' +
      '<div class="gallery-scroll" id="galGrid"><div class="loading">Cargando...</div></div>';
    ZMMX.state.gallery.offset = 0;
    ZMMX.state.gallery.items = [];
    this.loadMore();
  },
  onShow: function(opts){
    if (opts && opts.file) Gallery.open(opts.file);
  },
  loadMore: function(){
    var st = ZMMX.state.gallery;
    ZMMX.api('/api/zmmx/browse?category=images&source=' + ZMMX.state.lib.source + '&sort=name&order=asc&offset=' + st.offset + '&limit=60').then(function(r){
      st.items = st.items.concat(r.items || []);
      st.offset += (r.items || []).length;
      document.getElementById('galCount').textContent = (r.total || st.items.length) + ' imágenes';
      var grid = document.getElementById('galGrid');
      grid.classList.remove('loading');
      (r.items || []).forEach(function(f){
        var div = document.createElement('div');
        div.className = 'g-item';
        div.innerHTML = '<img loading="lazy" src="' + ZMMX.utils.getUrl(f) + '" alt=""><div class="g-name">' + ZMMX.utils.esc(f.name) + '</div>';
        div.addEventListener('click', function(){ Gallery.open(f); });
        grid.appendChild(div);
      });
    });
  }
});

document.addEventListener('keydown', function(e){
  var lb = document.getElementById('lightbox');
  if (lb.classList.contains('open')) {
    if (e.key === 'Escape') Gallery.close();
    if (e.key === 'ArrowLeft') Gallery.step(-1);
    if (e.key === 'ArrowRight') Gallery.step(1);
    return;
  }
  if (document.getElementById('searchInput') === document.activeElement) return;
  if (e.key === ' ') { e.preventDefault(); Player.toggle(); }
  if (e.key === 'ArrowRight') Player.seekBy(10);
  if (e.key === 'ArrowLeft') Player.seekBy(-10);
});
